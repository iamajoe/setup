[general]
live_config_reload = true

##################################################
# Theme: Catppucin

[colors.primary]
# background = "#1e1e2e"
background = "#121312"
# background = "#181920"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
# text = "#1e1e2e"
cursor = "#f5e0dc"
text = "#0F0F16"

[colors.vi_mode_cursor]
# text = "#1e1e2e"
cursor = "#b4befe"
text = "#0F0F16"

[colors.search.matches]
# foreground = "#1e1e2e"
background = "#a6adc8"
foreground = "#0F0F16"

[colors.search.focused_match]
# foreground = "#1e1e2e"
background = "#a6e3a1"
foreground = "#0F0F16"

[colors.footer_bar]
# foreground = "#1e1e2e"
background = "#a6adc8"
foreground = "#0F0F16"

[colors.hints.start]
# foreground = "#1e1e2e"
background = "#f9e2af"
foreground = "#0F0F16"

[colors.hints.end]
# foreground = "#1e1e2e"
background = "#a6adc8"
foreground = "#0F0F16"

[colors.selection]
# text = "#1e1e2e"
background = "#f5e0dc"
text = "#0F0F16"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[[colors.indexed_colors]]
index = 16
color = "#fab387"

[[colors.indexed_colors]]
index = 17
color = "#f5e0dc"

##################################################
# General settings

[colors]
draw_bold_text_with_bright_colors = true

[window]
# Make the window match better
decorations = "transparent"
padding.x = 10
padding.y = 10
dynamic_title = true

[cursor]
style = "Block"
# blinking = "On" seems not working

[font]
size = 11
# size = 15
offset.x = 1
offset.y = 2
normal.family = "NotoSansM Nerd Font"
normal.style = "Light"
# normal.family = "Myna"
# normal.family = "Monaco for Powerline"
bold.family = "NotoSansM Nerd Font"
bold.style = "SemiBold"

[terminal.shell]
# program = "/bin/zsh"
program = "/run/current-system/sw/bin/zsh"
# program = "/bin/bash"
# program = "/opt/homebrew/bin/fish"
args = ["--login"]

[keyboard]
bindings = [
    { key = "K", mods = "Command", action = "ClearHistory" },
    { key = "V", mods = "Command", action = "Paste" },
    { key = "C", mods = "Command", action = "Copy" },
    { key = "Key0", mods = "Command", action = "ResetFontSize" },
    { key = "Equals", mods = "Command", action = "IncreaseFontSize" },
    { key = "Plus", mods = "Command", action = "IncreaseFontSize" },
    { key = "NumpadAdd", mods = "Command", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Command", action = "DecreaseFontSize" },
    { key = "NumpadSubtract", mods = "Command", action = "DecreaseFontSize" }
]

