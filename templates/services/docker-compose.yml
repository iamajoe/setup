  paperlessbroker:
    image: docker.io/library/redis:8
    container_name: paperlessbroker
    restart: unless-stopped
    volumes:
      - "~/shared_data/services/docker-data/paperlessbroker:/data"
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperlessbroker
    ports:
      - "8017:8000"
    volumes:
      - "~/shared_data/services/docker-data/paperless/data:/usr/src/paperless/data"
      - "~/shared_data/services/docker-data/paperless/media:/usr/src/paperless/media"
      - "~/shared_data/services/docker-data/paperless/export:/usr/src/paperless/export"
      - "~/shared_data/services/docker-data/paperless/consume:/usr/src/paperless/consume"
    environment:
      - PGID=1000
      - PUID=1000
      - USERMAP_GID=1000
      - USERMAP_UID=1000
      - PAPERLESS_TIME_ZONE=Europe/Lisbon
      - PAPERLESS_OCR_LANGUAGES=eng por
      - PAPERLESS_REDIS=redis://paperlessbroker:6379

