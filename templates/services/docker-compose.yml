  # TODO: this will fail not being localhost and not having https
  #       it needs a reverse proxy with certificates
  #       https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose#caddy-with-dns-challenge
  passwordwarden:
    container_name: passwordwarden
    restart: unless-stopped
    image: vaultwarden/server:latest
    ports:
     - 8980:80
    environment:
      TZ: Europe/Lisbon
      # TODO: need to disable this the first time
      #       so we are able to create an user
      SIGNUPS_ALLOWED: false
      DISABLE_ADMIN_TOKEN: true
      ROCKET_TLS: '{certs="/certs/cloudflare_cert.pem",key="/certs/cloudflare_private.pem"}'
    volumes:
      - "~/shared_data/services/docker-data/vaultwarden/:/data"
      - "~/shared_data/services/docker-config/certificates/:/certs"

  # huginn:
  #   container_name: huginn
