  ##########################################
  # Development
  ##########################################

  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - ~/shared_data/services/docker-data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '3000:3000'
      - '222:22'
    restart: unless-stopped

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:12
    container_name: forgejo-runner
    command: ["forgejo-runner", "daemon"]
    # command: forgejo-runner daemon --config /data/runner-config.yml
    user: "0:0"
    group_add:
      - "131"   # known with: stat -c '%g' /var/run/docker.sock
    depends_on:
      - forgejo
    environment:
      FORGEJO_INSTANCE_URL: "http://forgejo:3000"
      FORGEJO_RUNNER_REGISTRATION_TOKEN: "w3HCZzsQB4ThYs9RhKyZImNL5tmHTa9D46SXWJ0K"
      # Optional but helpful:
      FORGEJO_RUNNER_NAME: "docker-runner-1"
      FORGEJO_RUNNER_LABELS: "ubuntu-latest:docker://node:20-bookworm,linux:docker://node:20-bookworm"
    volumes:
      - ~/shared_data/services/docker-data/forgejo-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ~/shared_data/services/docker-config/mosquitto:/mosquitto/config
      - ~/shared_data/services/docker-data/mosquitto/data:/mosquitto/data
      - ~/shared_data/services/docker-data/mosquitto/log:/mosquitto/log
