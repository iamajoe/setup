  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/Lisbon
    ports:
      - 7575:7575
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-config/homarr/data:/data
      - ./docker-config/homarr/configs:/app/data/configs
      - ./docker-config/homarr/icons:/app/public/icons
    restart: unless-stopped

