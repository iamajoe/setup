[opener]

[[opener.open]]
run = 'xdg-open "$1"'
orphan = true
desc = "Open default app"

[[opener.edit]]
run = 'hx "$@"'
block = true

[open]

[[open.prepend_rules]]
mime = "image/*"
use = "open"

[[open.prepend_rules]]
mime = "application/pdf"
use = "open"

[[open.prepend_rules]]
mime = "video/*"
use = "open"

[[open.prepend_rules]]
mime = "audio/*"
use = "open"

[[open.prepend_rules]]
mime = "application/zip"
use = "open"

[[open.rules]]
mime = "application/json"
use = "edit"

[[open.rules]]
mime = "text/*"
use = "edit"

[[open.rules]]
url = "*.md"
use = "edit"

[[open.rules]]
url = "*.yml"
use = "edit"

[[open.rules]]
url = "*.txt"
use = "edit"

[[open.rules]]
url = "*.json"
use = "edit"

[mgr]
show_hidden = true
sort_by = "mtime"
