- name: dev
  hosts: donkey
  tasks:
    - include_tasks: ../tasks/basic.yml
    - include_tasks: ../tasks/dev.yml
    # - include_tasks: ../tasks/zsh.yml
    - include_tasks: ../tasks/docker.yml

    - name: setup basic docker folders
      shell: mkdir -p {{ ansible_env.HOME }}/docker-config && chmod -R 777 {{ ansible_env.HOME }}/docker-config && mkdir -p {{ ansible_env.HOME }}/docker-data && chmod -R 777 {{ ansible_env.HOME }}/docker-data

    - name: copy docker compose
      template: src=../templates/donkey/docker-compose.yml dest="{{ ansible_env.HOME }}/docker-compose.yml"

    - name: copy transmission
      template: src=../templates/donkey/transmission.json dest="{{ ansible_env.HOME }}/docker-config/transmission/settings.json"

    - name: ensure homeassistant directory exists
      shell: mkdir -p {{ ansible_env.HOME }}/docker-config/homeassistant

    - name: copy homeassistant config
      template: src=../templates/donkey/homeassistant_configuration.yaml dest="{{ ansible_env.HOME }}/docker-config/homeassistant/configuration.yaml"

    - name: ensure hass directory exists
      shell: mkdir -p {{ ansible_env.HOME }}/docker-config/hass_configurator/config

    - name: copy hass configurator
      template: src=../templates/donkey/hass_configurator_settings.conf dest="{{ ansible_env.HOME }}/docker-config/hass_configurator/config/settings.conf"

    - name: ensure mosquitto directory exists
      shell: mkdir -p {{ ansible_env.HOME }}/docker-config/ha_mosquitto/config

    - name: copy mosquitto configurator
      template: src=../templates/donkey/mosquitto.conf dest="{{ ansible_env.HOME }}/docker-config/ha_mosquitto/config/mosquitto.conf"

    - name: ensure zigbee directory exists
      shell: mkdir -p {{ ansible_env.HOME }}/docker-config/ha_zigbee2mqtt

    - name: copy zigbee2mqtt config
      template: src=../templates/donkey/zigbee2mqtt_configuration.yaml dest="{{ ansible_env.HOME }}/docker-config/ha_zigbee2mqtt/configuration.yaml"

    - name: disable gui from XFCE
      shell: sudo systemctl disable lightdm.service
      become: true
