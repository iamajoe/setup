# Linux related
- name: install i3 packages
  when: ansible_os_family == "Debian"
  apt: name={{ item }} state=latest update_cache=yes
  loop: ["xorg", "xinit", "i3", "dunst"]
  become: true

- name: ensure config i3 directory exists
  when: ansible_os_family == "Debian"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/i3"
    state: directory
    mode: "0755"

- name: copy i3 configurations
  when: ansible_os_family == "Debian"
  template: src=../templates/i3_config dest="{{ ansible_env.HOME }}/.config/i3/config"
  when: ansible_os_family == "Debian"

# - name: copy i3 theme
#   when: ansible_os_family == "Debian"
#   template: src=../templates/i3_catppuccin dest="{{ ansible_env.HOME }}/.config/i3/catppuccin-mocha"

- name: ensure config i3status directory exists
  when: ansible_os_family == "Debian"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/i3status"
    state: directory
    mode: "0755"

- name: copy i3 status configurations
  when: ansible_os_family == "Debian"
  template: src=../templates/i3status_config dest="{{ ansible_env.HOME }}/.config/i3status/config"
  when: ansible_os_family == "Debian"

- name: setup x hi-res 
  when: ansible_os_family == "Debian" and is_hi_res == "true"
  template: src=../templates/Xresources_hires dest="{{ ansible_env.HOME }}/.Xresources"

- name: setup x normal
  when: ansible_os_family == "Debian" and is_hi_res == "false"
  template: src=../templates/Xresources dest="{{ ansible_env.HOME }}/.Xresources"
