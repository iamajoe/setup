- name: install Open VM Tools (Ubuntu/Debian)
  ansible.builtin.apt:
    name:
      - open-vm-tools
      - open-vm-tools-desktop
    state: present
  when: ansible_facts['os_family'] == "Debian"
  become: true

- name: install VMware Tools (RHEL/CentOS)
  ansible.builtin.yum:
    name: open-vm-tools
    state: present
  when: ansible_facts['os_family'] == "RedHat"
  become: true

- name: restart VMware Tools service
  ansible.builtin.systemd:
    name: vmtoolsd
    state: restarted
  when: ansible_facts['os_family'] == "Debian" or ansible_facts['os_family'] == "RedHat"
  become: true
