  when: ansible_os_family == "Debian"
  shell: mkdir -p {{ ansible_env.HOME }}/Apps && rm -rf {{ ansible_env.HOME }}/Apps/Carla* && wget -P {{ ansible_env.HOME }}/Apps/ https://github.com/falkTX/Carla/releases/download/v2.2.0/Carla_2.2.0-linux64.tar.xz
