- name: remove pipewire example session
  when: ansible_os_family == "Debian"
  shell: apt remove -y pipewire-media-session
  become: true

# https://trendoceans.com/enable-pipewire-and-disable-pulseaudio-in-ubuntu/
- name: install pipewire
  when: ansible_os_family == "Debian"
  apt: name={{ item }} state=latest update_cache=yes
  loop:
    [
      "pipewire",
      "pipewire-audio-client-libraries",
      "pipewire-bin",
      "pipewire-pulse",
      "libspa-0.2-bluetooth",
      "libspa-0.2-jack",
      "gstreamer1.0-pipewire",
      "wireplumber",
      "libpipewire-0.3-{0,dev,modules} libspa-0.2-{bluetooth,dev,jack,modules} pipewire{,-{audio-client-libraries,pulse,bin,tests}}",
      "wireplumber gir1.2-wp-0.4 libwireplumber-0.4-{0,dev}"
    ]
  become: true

- name: change to pipewire
  when: ansible_os_family == "Debian"
  shell: >
    systemctl --user --now disable pulseaudio.{socket,service}
    systemctl --user mask pulseaudio
    sudo cp -vRa /usr/share/pipewire /etc/
    systemctl --user --now enable pipewire{,-pulse}.{socket,service}
  become: true

- name: install Audacity
  when: ansible_os_family == "Debian"
  shell: flatpak install flathub org.audacityteam.Audacity -y
  become: true

