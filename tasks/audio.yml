- name: remove pipewire example session
  when: ansible_os_family == "Debian"
  shell: apt remove -y pipewire-media-session
  become: true

- name: install pipewire
  when: ansible_os_family == "Debian"
  apt: name={{ item }} state=latest update_cache=yes
  loop:
    [
      "libpipewire-0.3.0",
      "libpipewire-0.3.0-common",
      "libpipewire-0.3.0-modules",
      "pipewire",
      "pipewire-audio-client-libraries",
      "pipewire-bin",
      "pipewire-pulse",
      "libspa-0.2-bluetooth",
      "libspa-0.2-jack",
      "wireplumber",
    ]
  become: true

- name: install Audacity
  when: ansible_os_family == "Debian"
  shell: flatpak install flathub org.audacityteam.Audacity -y
  become: true

- name: install Easy Effects
  when: ansible_os_family == "Debian"
  shell: flatpak install flathub com.github.wwmm.easyeffects -y
  become: true

- name: configure Easy Effects
  when: ansible_os_family == "Debian"
  shell: flatpak permission-reset com.github.wwmm.easyeffects
  become: true
