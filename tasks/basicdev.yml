- name: copy profile configurations
  template: src=../templates/dev/profile dest="{{ ansible_env.HOME  }}/.profile"

- name: copy userrc configurations
  template: src=../templates/dev/userrc dest="{{ ansible_env.HOME  }}/.userrc"

- name: copy gitconfig configurations
  template: src=../templates/dev/gitconfig dest="{{ ansible_env.HOME  }}/.gitconfig"

- name: set github work folder
  shell: mkdir -p {{ ansible_env.HOME  }}/work/src/github.com
  become: true

- name: set local work folder
  shell: mkdir -p {{ ansible_env.HOME  }}/work/src/local
  become: true
