- name: copy npm configurations
  shell: printf 'prefix = {{ ~ | expanduser  }}/npm' > .npmrc

# MAC related
- name: install nodejs
  when: ansible_os_family == "Darwin"
  shell: brew install node@18
  become: true
    
# Linux related
- name: add nodejs apt key
  when: ansible_os_family == "Debian"
  apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
    state: present
    become: true

- name: add nodejs 18.x ppa for apt repo
  when: ansible_os_family == "Debian"
  apt_repository:
    repo: deb https://deb.nodesource.com/node_18.x bionic main
    update_cache: true
    become: true

- name: install nodejs
  when: ansible_os_family == "Debian"
  apt:
    name: nodejs
    state: present
    update_cache: true

# Dependencies
- name: install npm distributed command-line tools
  npm:
    global: yes
    name: "{{ item }}"
    with_item:
      - typescript
