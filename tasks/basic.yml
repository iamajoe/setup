# Linux related
- name: upgrade apt
  when: ansible_os_family == "Debian"
  apt:
    update_cache: yes
    upgrade: "yes"
  become: true

- name: install aptitude using apt
  when: ansible_os_family == "Debian"
  apt: name=aptitude state=latest update_cache=yes force_apt_get=yes
  become: true

- name: install required system packages
  when: ansible_os_family == "Debian"
  apt: name={{ item }} state=latest update_cache=yes
  loop:
    [
      "apt-transport-https",
      "ca-certificates",
      "curl",
      "software-properties-common",
      "python3-pip",
      "virtualenv",
      "python3-setuptools",
      "git",
      "vim",
      "tmux",
      "ripgrep",
      "bat",
      "thunar-archive-plugin",
    ]
  become: true

- name: set timezone
  when: ansible_os_family == "Debian"
  shell: timedatectl set-timezone UTC
  become: true

- name: install flatpak
  when: ansible_os_family == "Debian"
  apt: name={{ item }} state=latest update_cache=yes
  loop: ["flatpak"]
  become: true

- name: configure flatpak flathub
  when: ansible_os_family == "Debian"
  shell: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  become: true

- name: install neovim
  when: ansible_os_family == "Debian"
  # shell: mkdir -p {{ ansible_env.HOME }}/Apps && rm -rf {{ ansible_env.HOME }}/Apps/nvim.appimage* && wget -P {{ ansible_env.HOME }}/Apps/ https://github.com/neovim/neovim/releases/download/stable/nvim.appimage && chmod u+x {{ ansible_env.HOME }}/Apps/nvim.appimage
  shell: flatpak install flathub io.neovim.nvim

# MAC related
- name: install dependencies
  when: ansible_os_family == "Darwin"
  become: true
  shell: brew install tmux neovim git ripgrep bat
