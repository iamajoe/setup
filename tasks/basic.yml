# Linux related
- name: upgrade apt
  when: ansible_os_family == "Debian"
  apt:
    update_cache: yes
    upgrade: "yes"
  become: true

- name: install aptitude using apt
  when: ansible_os_family == "Debian"
  apt: name=aptitude state=latest update_cache=yes force_apt_get=yes
  become: true

- name: install required system packages
  when: ansible_os_family == "Debian"
  apt: name={{ item }} state=latest update_cache=yes
  loop:
    [
      "apt-transport-https",
      "ca-certificates",
      "curl",
      "software-properties-common",
      "python3-pip",
      "virtualenv",
      "python3-setuptools",
      "git",
      "vim",
      "tmux",
      "ripgrep",
      "bat",
      "thunar-archive-plugin",
    ]
  become: true

- name: Install snap required packages
  when: ansible_os_family == "Debian"
  snap:
    name: neovim
    classic: yes

- name: set timezone
  when: ansible_os_family == "Debian"
  shell: timedatectl set-timezone UTC
  become: true

# MAC related
- name: install dependencies
  when: ansible_os_family == "Darwin"
  become: true
  shell: brew install tmux neovim git ripgrep bat
