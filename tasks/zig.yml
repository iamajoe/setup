- name: remove zig if it exists
  ansible.builtin.file:
    path: "/usr/local/zig"
    state: absent
  become: yes

- name: download zig
  ansible.builtin.get_url:
    url: "https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz"
    dest: "/tmp/zig013.tar.gz"
    mode: "0644"

- name: ensure /usr/local/zig directory exists
  ansible.builtin.file:
    path: "/usr/local/zig"
    state: directory
    mode: "0755"
  become: yes # Run as root if needed

- name: extract and install zig
  ansible.builtin.unarchive:
    src: "/tmp/zig013.tar.gz"
    dest: "/usr/local/bin"
    remote_src: yes
    extra_opts: [--strip-components=1] # Ensures correct structure
  become: yes
